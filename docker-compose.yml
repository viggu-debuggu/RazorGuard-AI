version: '3.8'

services:
  # Database Service (Postgres with pgvector extension pre-installed)
  db:
    image: pgvector/pgvector:pg16
    container_name: razorguard_db
    restart: always
    # WARNING: Dev-only default credentials. Change for production deployment.
    environment:
      POSTGRES_DB: razorguard_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d razorguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: razorguard_backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/razorguard_db
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - SECRET_KEY=${SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./knowledge_graph:/app/knowledge_graph
      - ./ml:/app/ml
      - ./scripts:/app/scripts
      - ./tests:/app/tests
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Next.js Analyst Console Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: razorguard_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend

volumes:
  pgdata:
